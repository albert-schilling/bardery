name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nrwl/nx-set-shas reads the last successful run on main to pick the base for `nx affected`.
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `nx affected` compares against earlier commits, so it needs the full history.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - run: pnpm nx affected -t lint typecheck test build test-image

  terraform-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [shared, staging]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - run: terraform fmt -check -diff
      # No backend: validating needs the providers, not the state.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # One config for every root, so it's passed explicitly: tflint looks in the working directory.
      - run: tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
      - run: tflint --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"

  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [shared, staging]
    permissions:
      contents: read
      id-token: write # OIDC token for azure
      pull-requests: write # the plan comment
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD_AUTH: true
      # The read-only identity: pull requests run code the PR itself can change.
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
      # No lock: a read-only identity can't write the lock to the state blob.
      - run: terraform plan -input=false -no-color -lock=false -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROOT: ${{ matrix.root }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const marker = `<!-- terraform-plan:${root} -->`;
            // Comments cap at 65536 characters.
            const plan = fs.readFileSync(`infra/envs/${root}/plan.txt`, 'utf8').slice(0, 60000);
            const body = `${marker}\n### Terraform plan: \`${root}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    if: github.event_name == 'push'
    needs: [checks, terraform-checks]
    runs-on: ubuntu-latest
    environment: staging
    # Deploys never overlap: two applies would fight over the state lock.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for azure
      packages: write # push the image to GHCR with GITHUB_TOKEN
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD_AUTH: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      IMAGE: ghcr.io/albert-schilling/bardery-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Checks of an older commit can finish after a newer one has deployed. Once this run has the
      # deployment slot, skip it if main has moved on, so staging never goes back to older code.
      - id: gate
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the deploy: main is at $head, newer than $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.current == 'true'
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
        if: steps.gate.outputs.current == 'true'
        working-directory: infra/envs/staging
      - run: terraform apply -input=false -auto-approve -lock-timeout=300s
        if: steps.gate.outputs.current == 'true'
        working-directory: infra/envs/staging

      # The web app is built once here and deployed as the image.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.current == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.current == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.current == 'true'
      - run: pnpm nx build web
        if: steps.gate.outputs.current == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.gate.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.gate.outputs.current == 'true'
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE" apps/web
          docker push "$IMAGE"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.gate.outputs.current == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az containerapp update --name web --resource-group bardery-staging --image "$IMAGE"
        if: steps.gate.outputs.current == 'true'
