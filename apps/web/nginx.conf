server {
    # nginx-unprivileged can't bind ports below 1024.
    listen 8080;
    root /usr/share/nginx/html;

    # Vite puts a content hash in every asset's name, so an asset never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a route of the SPA: serve index.html, so reloading a deep link works.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
